name: Cloud Human Confidence Tests

# Runs the Human Confidence example's live tests
# (examples/pipeline/human_confidence/live_test.go) against the staging
# cloud, because the production cloud does not serve HumanConfidenceSource
# or a passive level other than Unknown yet. The Bespoke key's answer carries
# Passive and a plain level. The Basic key's answer carries the source as
# null, with a reason.
#
# CLOUD_STAGING_ENDPOINT, the staging cloud's API base, is an organization
# variable, and RESOURCE_KEY_BESPOKE_STAGING is an organization secret. Only
# CI uses them, and common-ci passes on only _51DEGREES_ names, so the tests
# skip in the shared builds and run here, where this step sets the names.
#
# The job fails when a name is empty or when a test was skipped or did not
# run. A cloud test that passes without calling the cloud has proved
# nothing.

on:
  workflow_dispatch:
  # Nightly as well, so a change in what the service answers is found the
  # next morning rather than by a customer.
  schedule:
    - cron: '20 6 * * *'
  pull_request:
    branches: [main, rc]
    # The example, and the files that set the job's Go version and build.
    paths:
      - 'examples/pipeline/human_confidence/**'
      - 'examples/pipeline/go.mod'
      - 'examples/pipeline/go.sum'
      - 'go.work'
      - '.github/workflows/cloud-human-confidence.yml'

permissions:
  contents: read

jobs:
  cloud-human-confidence:
    name: Cloud Human Confidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/pipeline/go.mod
          cache: false

      # go test -run exits 0 when its pattern matches nothing, and a skipped
      # test does not fail, so each test is named here and its PASS line is
      # required. -count=1 calls the cloud on every run rather than replaying
      # a cached result.
      - name: Live tests against the staging cloud
        working-directory: examples/pipeline
        shell: bash
        env:
          CLOUD_STAGING_ENDPOINT: ${{ vars.CLOUD_STAGING_ENDPOINT }}
          RESOURCE_KEY_BESPOKE_STAGING: ${{ secrets.RESOURCE_KEY_BESPOKE_STAGING }}
          _51DEGREES_RESOURCE_KEY_BASIC: ${{ secrets._51DEGREES_RESOURCE_KEY_BASIC }}
        run: |
          missing=0
          for name in CLOUD_STAGING_ENDPOINT RESOURCE_KEY_BESPOKE_STAGING \
              _51DEGREES_RESOURCE_KEY_BASIC; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty or missing, so the live tests cannot run."
              missing=1
            fi
          done
          if [ $missing -ne 0 ]; then exit 1; fi
          names='TestLiveBespokeKeyGetsSourcePassive'
          names="$names TestLiveKeyOutsideBespokeGetsNoSource"
          pattern=$(echo $names | tr ' ' '|')
          set +e
          output=$(go test -count=1 -v -run "^(${pattern})\$" ./human_confidence 2>&1)
          status=$?
          set -e
          echo "$output"
          for name in $names; do
            if ! grep -q -- "--- PASS: $name" <<< "$output"; then
              echo "::error::$name did not pass, so it failed, was skipped or did not run."
              status=1
            fi
          done
          exit $status
