name: Temporary Enterprise example tests

on: push

jobs:
  test:
    name: Device Detection example tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Go version
        run: go version
      - name: Free data files, downloaded once as a fresh clone would
        run: |
          for f in "51Degrees-LiteV4.1.hash" "20000 Evidence Records.yml"; do
            for i in 1 2 3 4 5 6; do
              sh cxx/data/get-data-files.sh "$f" && break
              sleep 30
            done
          done
          ls -la cxx/data/device-detection
      - name: Example tests, with no settings, one package at a time
        working-directory: examples/device-detection
        run: go test -v -count=1 -p 1 -timeout 40m ./...
