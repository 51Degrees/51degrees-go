name: Pull Requests

# Started by hand only. A run that passes merges the pull request unless
# dryrun is ticked.
on:
  workflow_dispatch:
    inputs:
      dryrun:
        type: boolean
        default: false
      prs:
        description: 'Comma-separated pull request numbers to build, drafts included (default: every non-draft pull request into main)'
        type: string
        default: ''
      common-ci-ref:
        type: string
        default: ''
      full-matrix:
        description: 'Build every configuration, not only those the changes need'
        type: boolean
        default: false

jobs:
  PullRequests:
    name: Pull Requests
    uses: 51Degrees/common-ci/.github/workflows/nightly-pull-requests.yml@6f756057e5252a27df60d7722dc036f5bebd4369
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
      prs: ${{ inputs.prs }}
      common-ci-ref: ${{ inputs.common-ci-ref || '' }}
      cache-assets: true
      # Each pull request is built on the configurations its changes need,
      # as ci/select-options.ps1 chooses, and one that fails does not cancel
      # the others. With nothing eligible, the nightly builds rc instead.
      full-matrix: ${{ inputs.full-matrix || false }}
      fail-fast: false
      build-without-pull-requests: false
    secrets: inherit
